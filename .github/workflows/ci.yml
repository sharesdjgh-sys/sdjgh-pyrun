name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Build imports the clients but does not call the database or AI service.
          NEON_DATABASE_URL: postgresql://ci-only:ci-only@127.0.0.1:1/ci_only
          GEMINI_API_KEY: ci-build-only
          AUTH_SECRET: ci-build-only-not-for-runtime-xxxxxxxx
